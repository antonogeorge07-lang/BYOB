name: Build macOS release

on:
  push:
    branches:
      - "user/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example, v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release executable
        run: swift build -c release

      - name: Package the macOS app
        run: |
          APP_NAME="Simple Browser.app"
          APP_PATH="release/${APP_NAME}"
          mkdir -p "${APP_PATH}/Contents/MacOS"
          cp AppBundle/Info.plist "${APP_PATH}/Contents/Info.plist"
          cp .build/arm64-apple-macosx/release/SimpleBrowser "${APP_PATH}/Contents/MacOS/SimpleBrowser"
          codesign --force --deep --sign - "${APP_PATH}"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" SimpleBrowser-macos.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            gh release create "${{ inputs.tag }}" SimpleBrowser-macos.zip \
              --target "${GITHUB_SHA}" \
              --title "Simple Browser ${{ inputs.tag }}" \
              --generate-notes
          elif [ "${REF_TYPE}" = "branch" ]; then
            USER_NAME="${REF_NAME#user/}"
            USER_SLUG="$(echo "${USER_NAME}" | tr '/' '-')"
            git fetch origin main
            VERSION="$(git rev-list --count origin/main..HEAD)"
            BUILD_TAG="${USER_SLUG}-${VERSION}-${GITHUB_SHA:0:7}"
            gh release create "${BUILD_TAG}" SimpleBrowser-macos.zip \
              --title "Simple Browser — ${USER_NAME}-${VERSION}" \
              --notes "Automated build for ${USER_NAME}, version ${VERSION} (commits ahead of main), at commit \`${GITHUB_SHA}\`." \
              --prerelease
          else
            gh release create "${REF_NAME}" SimpleBrowser-macos.zip \
              --title "Simple Browser ${REF_NAME}" \
              --generate-notes
          fi
